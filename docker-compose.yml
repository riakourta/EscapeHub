services:
  db:
    image: postgres:17-alpine
    container_name: escapehub-postgres
    environment:
      POSTGRES_DB: escapehub_db
      POSTGRES_USER: escapehub_user
      POSTGRES_PASSWORD: escapehub_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escapehub_user -d escapehub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: escapehub-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/escapehub_db
      SPRING_DATASOURCE_USERNAME: escapehub_user
      SPRING_DATASOURCE_PASSWORD: escapehub_pass
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: