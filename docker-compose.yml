services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: escapehub
      POSTGRES_USER: escapehub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-demo-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escapehub -d escapehub"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: integrated
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/escapehub
      SPRING_DATASOURCE_USERNAME: escapehub
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-local-demo-only}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
