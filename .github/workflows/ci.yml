name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-test-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash mvnw -B verify
      - run: docker compose config --quiet
      - run: docker build -t escapehub:ci .
