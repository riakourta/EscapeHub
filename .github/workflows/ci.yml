name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-test-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node src/main/resources/static/UI_Tests.js
      - run: node --test scripts/frontend.test.cjs
      - run: bash mvnw -B verify
      - run: docker compose config --quiet
      - run: docker build -t escapehub:ci .
