<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscapeHub - Πτέρυγα Sully (Δωμάτιο 2)</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .hud {
            width: 1126px; /* 800px canvas + 16px gap + 310px sidebar */
            max-width: 100%;
            background: #0d0d14;
            border: 1px solid #262638;
            border-radius: 6px;
            padding: 10px 16px;
            margin-bottom: 12px;
            font-size: 0.92rem;
            color: #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-exit-btn {
            background: #151522;
            color: #e0e0e0;
            border: 1px solid #2a2a3d;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .hud-exit-btn:hover {
            background: #b30000;
            border-color: #ff1a1a;
            color: #fff;
        }

        .main-layout {
            display: flex;
            gap: 16px;
            align-items: stretch;
        }

        #game-wrapper {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #222;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        #sullyCanvas {
            display: block;
            background-color: #101018;
        }

        .darkness-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(
                circle at center,
                rgba(15, 15, 25, 0.25) 20%,
                rgba(0, 0, 0, 0.95) 90%
            );
            animation: roomAlarm 1.5s infinite alternate ease-in-out;
        }

        @keyframes roomAlarm {
            0% {
                box-shadow: inset 0 0 30px rgba(180, 0, 0, 0.15);
            }
            100% {
                box-shadow: inset 0 0 95px rgba(255, 0, 0, 0.55);
            }
        }

        .sidebar {
            width: 310px;
            height: 600px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .journal-panel {
            background: #0d0d14;
            border: 1px solid #262638;
            border-radius: 6px;
            padding: 12px;
            flex: 1;
            overflow-y: auto;
        }

        .journal-panel h2 {
            font-size: 0.95rem;
            color: #e6c36a;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #1f1f2e;
        }

        #journal-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
        }

        #journal-list li {
            background: #151522;
            padding: 7px 9px;
            border-left: 3px solid #00d2ff;
            border-radius: 3px;
        }
    </style>
</head>

<body>
<div class="hud">
    <div>
        🔦 <b>Πτέρυγα Sully (Δωμάτιο 2)</b> | Περάσατε επιτυχώς από την Πτέρυγα Richelieu! Κίνηση: <b>⬆️ ⬇️ ⬅️ ➡️</b> ή <b>W A S D</b>
    </div>
    <a href="lobby.html" class="hud-exit-btn">Έξοδος στο Lobby</a>
</div>

<div class="main-layout">
    <div id="game-wrapper">
        <canvas id="sullyCanvas" width="800" height="600"></canvas>
        <div id="darkness" class="darkness-overlay"></div>
    </div>

    <aside class="sidebar">
        <section class="journal-panel">
            <h2>📜 Κοινό Ημερολόγιο</h2>
            <ul id="journal-list">
                <li>✓ Η πόρτα της Πτέρυγας Richelieu ξεκλείδωσε.</li>
                <li>Είσοδος στην Πτέρυγα Sully.</li>
            </ul>
        </section>
    </aside>
</div>

<div class="legend-bar" style="margin-top: 10px; font-size: 0.82rem; color: #777; display: flex; gap: 18px;">
    <span><b style="color:#00d2ff">●</b> Εσύ</span>
    <span><b style="color:#ff9900">●</b> Συμπαίκτης</span>
</div>

<script>
    (() => {
        const canvas = document.getElementById('sullyCanvas');
        const ctx = canvas.getContext('2d');

        const W = canvas.width;
        const H = canvas.height;
        const PLAYER_RADIUS = 11;
        const SPEED = 3.0;

        const myName = localStorage.getItem('playerNickname')
            || localStorage.getItem('username')
            || 'Εσύ';

        // Οι παίκτες μπαίνουν περπατώντας από αριστερά (από την Πτέρυγα Richelieu)
        const players = [
            {
                name: myName,
                color: '#00d2ff',
                x: -20,
                y: H / 2 - 22,
                targetX: 115,
                angle: 0,
                entering: true,
                isLocal: true
            },
            {
                name: 'Συμπαίκτης',
                color: '#ff9900',
                x: -60,
                y: H / 2 + 24,
                targetX: 90,
                angle: 0,
                entering: true,
                isLocal: false
            }
        ];

        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const local = players[0];
            if (local.entering) return;
            const rect = canvas.getBoundingClientRect();
            local.angle = Math.atan2(e.clientY - rect.top - local.y, e.clientX - rect.left - local.x);
        });

        function update() {
            players.forEach((p) => {
                if (p.entering) {
                    p.x += 2.2;
                    p.angle = 0;
                    if (p.x >= p.targetX) {
                        p.x = p.targetX;
                        p.entering = false;
                    }
                }
            });

            const local = players[0];
            if (!local.entering) {
                let dx = 0;
                let dy = 0;
                if (keys['w'] || keys['arrowup']) dy -= SPEED;
                if (keys['s'] || keys['arrowdown']) dy += SPEED;
                if (keys['a'] || keys['arrowleft']) dx -= SPEED;
                if (keys['d'] || keys['arrowright']) dx += SPEED;

                if (dx !== 0 || dy !== 0) {
                    if (dx !== 0 && dy !== 0) {
                        dx *= 0.7071;
                        dy *= 0.7071;
                    }
                    local.angle = Math.atan2(dy, dx);
                    local.x = Math.max(24, Math.min(W - 24, local.x + dx));
                    local.y = Math.max(24, Math.min(H - 24, local.y + dy));
                }
            }
        }

        function drawRoom() {
            ctx.fillStyle = '#101018';
            ctx.fillRect(0, 0, W, H);

            // Ίδιο πλέγμα πλακιδίων με το Δωμάτιο 1
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= W; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = 0; y <= H; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            // Ανοιχτή είσοδος αριστερά (συνέχεια από Πτέρυγα Richelieu)
            ctx.fillStyle = 'rgba(0, 255, 136, 0.14)';
            ctx.fillRect(0, H / 2 - 55, 14, 110);
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, H / 2 - 55, 14, 110);

            ctx.save();
            ctx.translate(28, H / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillStyle = 'rgba(0, 255, 136, 0.55)';
            ctx.font = 'bold 11px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Από Πτέρυγα Richelieu', 0, 0);
            ctx.restore();
        }

        function drawPlayer(p) {
            // Κώνος φακού
            const coneLength = 240;
            const spread = 0.55;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            const beam = ctx.createRadialGradient(0, 0, 4, 0, 0, coneLength);
            beam.addColorStop(0, 'rgba(255, 250, 230, 0.25)');
            beam.addColorStop(0.6, 'rgba(255, 250, 230, 0.08)');
            beam.addColorStop(1, 'rgba(255, 250, 230, 0)');
            ctx.fillStyle = beam;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, coneLength, -spread, spread);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Κυκλικός παίκτης με λάμψη
            ctx.save();
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 12;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();

            // Όνομα παίκτη
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(p.name, p.x, p.y - 17);
        }

        function loop() {
            update();
            drawRoom();
            players.forEach(drawPlayer);
            requestAnimationFrame(loop);
        }

        loop();
    })();
</script>
</body>
</html>
