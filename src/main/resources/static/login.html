<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscapeHub - Σύνδεση & Εγγραφή</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #080a0f;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 36px 36px;
            color: #d1d5db;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .auth-box {
            background-color: #0f1218;
            border: 1px solid #7f1d1d;
            border-radius: 6px;
            padding: 32px 36px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 25px rgba(180, 20, 20, 0.2), 0 20px 50px rgba(0, 0, 0, 0.85);
        }
        h2 {
            color: #ef4444;
            font-size: 1.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 0 0 6px 0;
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
        }
        .subtitle {
            color: #9ca3af;
            font-size: 0.88rem;
            margin: 0 0 22px 0;
        }
        .form-group {
            text-align: left;
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.82rem;
            color: #9ca3af;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 4px;
            border: 1px solid #374151;
            background-color: #181c24;
            color: #f3f4f6;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease;
        }
        input:focus {
            border-color: #eab308;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            width: 100%;
            padding: 11px;
            border-radius: 5px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-login {
            background-color: #990000;
            color: #ffffff;
            border: 1px solid #b91c1c;
        }
        .btn-login:hover {
            background-color: #b30000;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4);
        }
        .btn-register {
            background-color: #211c17;
            color: #eab308;
            border: 1px solid #85683a;
        }
        .btn-register:hover {
            background-color: #2c251e;
            border-color: #eab308;
        }
        .msg-error { color: #f87171; margin-top: 15px; font-size: 0.88rem; min-height: 20px; }
        .msg-success { color: #34d399; margin-top: 15px; font-size: 0.88rem; min-height: 20px; }
    </style>
</head>
<body>
<div class="auth-box">
    <h2>ESCAPE HUB</h2>
    <p class="subtitle">Ταυτοποίηση Πράκτορα πριν την αποστολή</p>

    <form id="loginForm" data-next-page="profile.html">
        <div class="form-group">
            <label for="username">Όνομα Χρήστη (Username)</label>
            <input type="text" id="username" placeholder="Εισάγετε username" autocomplete="username" />
        </div>

        <div class="form-group">
            <label for="password">Κωδικός Πρόσβασης (Password)</label>
            <input type="password" id="password" placeholder="Εισάγετε κωδικό" minlength="4" autocomplete="current-password" />
        </div>

        <div class="btn-group">
            <button type="submit" id="loginBtn" class="btn-login">ΣΥΝΔΕΣΗ</button>
            <button type="button" id="registerBtn" class="btn-register">ΔΗΜΙΟΥΡΓΙΑ ΛΟΓΑΡΙΑΣΜΟΥ</button>
        </div>
    </form>

    <div id="authMessage"></div>
</div>

<script src="apiClient.js"></script>
<script src="auth.js"></script>
</body>
</html>
