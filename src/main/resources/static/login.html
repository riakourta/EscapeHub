<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>EscapeHub — Login</title><style>body{font:18px system-ui;background:#101827;color:#eef;margin:40px auto;max-width:900px;padding:20px}button,input{font:inherit;padding:10px;margin:8px}a{color:#63e6be}canvas{max-width:100%;border:2px solid #64748b}</style><h1>EscapeHub — Login</h1><p>Local demo: player1 … player4 / demo-pass</p><form method="post" action="/login"><input name="username" required placeholder="Username"><input name="password" type="password" required placeholder="Password"><input type="hidden" name="_csrf" id="csrf"><button disabled>Login</button></form><p id="error"></p><script>fetch('/api/csrf').then(r=>r.json()).then(t=>{document.querySelector('#csrf').value=t.token;document.querySelector('button').disabled=false;}).catch(()=>document.querySelector('#error').textContent='Cannot load login token');if(location.search.includes('error'))document.querySelector('#error').textContent='Invalid credentials';</script></html>
