<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscapeHub - Αίθουσα Α</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Intro Modal - Κρυφό στην 1η σκηνή, εμφανίζεται μόλις κλέψεις το 1ο έκθεμα */
        #intro-modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.94);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 2rem;
        }

        .alarm-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px #ff0000);
            animation: pulseAlarm 0.8s infinite alternate;
        }

        @keyframes pulseAlarm {
            from {
                transform: scale(1);
                filter: drop-shadow(0 0 10px #ff0000);
            }
            to {
                transform: scale(1.15);
                filter: drop-shadow(0 0 30px #ff3333);
            }
        }

        .modal-box {
            max-width: 600px;
            border: 1px solid #8b0000;
            padding: 2.5rem;
            background: #0d0d12;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.25);
            border-radius: 8px;
            color: #fff;
        }

        .modal-box h1 {
            color: #ff3333;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .modal-box p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 1.8rem;
            color: #cccccc;
        }

        #start-btn {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #b30000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #start-btn:hover {
            background-color: #ff1a1a;
        }

        .hud {
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #999;
        }

        #game-wrapper {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #222;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
        }

        #museumCanvas {
            display: block;
            background-color: #101018;
        }

        /* 1η Σκηνή: Ήσυχο σκοτάδι χωρίς κόκκινο συναγερμό */
        .darkness-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(
                    circle at center,
                    rgba(15, 15, 25, 0.25) 20%,
                    rgba(0, 0, 0, 0.95) 90%
            );
            transition: box-shadow 0.5s ease;
        }

        /* 2η Σκηνή: Ενεργοποίηση κόκκινου παλμού συναγερμού */
        .darkness-overlay.alarm-active {
            animation: roomAlarm 1.5s infinite alternate ease-in-out;
        }

        @keyframes roomAlarm {
            0% { box-shadow: inset 0 0 30px rgba(180, 0, 0, 0.15); }
            100% { box-shadow: inset 0 0 95px rgba(255, 0, 0, 0.55); }
        }

        /* Αγχωτικό τρέμουλο οθόνης τη στιγμή της κλοπής */
        .panic-shake {
            animation: shakeScreen 0.12s infinite;
        }

        @keyframes shakeScreen {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-7px, 5px); }
            50% { transform: translate(7px, -5px); }
            75% { transform: translate(-5px, -5px); }
            100% { transform: translate(5px, 5px); }
        }
    </style>
</head>
<body>

<!-- Intro Modal (Εμφανίζεται μετά την κλοπή του μπροστινού εκθέματος) -->
<div id="intro-modal">
    <div class="alarm-icon">🚨</div>
    <div class="modal-box">
        <h1>ΣΥΝΑΓΕΡΜΟΣ ΕΝΕΡΓΟΠΟΙΗΘΗΚΕ</h1>
        <p>
            Πήρατε το έργο τέχνης, αλλά ο συναγερμός ενεργοποιήθηκε...
            Τα φώτα ασφαλείας άναψαν και η Κεντρική Πύλη της Πυραμίδας κλείδωσε!
            Βρείτε την έξοδο προς την Πτέρυγα Sully!
        </p>
        <button id="start-btn">Συνέχεια</button>
    </div>
</div>

<div class="hud" id="hud-text">
    🔦 Κεντρική Αίθουσα Richelieu Wing | Πλησιάστε το έκθεμα μπροστά σας με τα βελάκια (⬆️ ⬇️ ⬅️ ➡️)
</div>

<!-- Καμβάς Μουσείου & Εφέ Σκοταδιού -->
<div id="game-wrapper">
    <canvas id="museumCanvas" width="800" height="600"></canvas>
    <div id="darkness" class="darkness-overlay"></div>
</div>

<script src="js/playerMovement.js"></script>
<script src="js/gameRenderer.js"></script>
<script src="apiClient.js"></script>
<script src="js/gameChatAndExit.js"></script>
</body>
</html>
