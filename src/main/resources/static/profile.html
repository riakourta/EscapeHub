
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>EscapeHub - Προφίλ Παίκτη</title>
    <style>
        body { background-color: #121212; color: #f0f0f0; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.7); width: 340px; text-align: center; border: 1px solid #333; }
        input, select { width: 95%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #2c2c2c; color: #fff; }
        button { width: 95%; padding: 12px; margin-top: 15px; border: none; border-radius: 5px; background-color: #2a9d8f; color: white; font-weight: bold; cursor: pointer; }
        .msg-error { color: #ff4d4d; margin-top: 15px; font-size: 0.9em; min-height: 20px; }
        .msg-success { color: #4dff88; margin-top: 15px; font-size: 0.9em; min-height: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Προφίλ Παίκτη</h2>
    <p>Ρύθμιση στοιχείων πριν την είσοδο στο Lobby</p>
    <form id="profileForm" data-auth-page="/login.html" data-next-page="/lobby.html">
        <label for="nickname">Ψευδώνυμο (Nickname):</label>
        <input type="text" id="nickname" placeholder="Εισάγετε ψευδώνυμο" />

        <label for="avatarColor">Χρώμα Χαρακτήρα:</label>
        <select id="avatarColor"><option>Red</option><option>Blue</option><option>Green</option><option>Yellow</option></select>

        <button type="submit">Αποθήκευση & Είσοδος στο Lobby</button>
    </form>
    <div id="profileMessage"></div>
</div>

<script src="apiClient.js"></script>
<script src="auth.js"></script>
</body>
</html>
