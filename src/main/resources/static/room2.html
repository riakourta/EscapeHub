<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscapeHub — Δωμάτιο 2: Πτέρυγα Sully</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #2a0a0d 0%, #0d0709 65%, #050304 100%);
            color: #f4ecec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .room-container {
            width: 100%;
            max-width: 620px;
            background: rgba(16, 10, 12, 0.94);
            border: 2px solid #dc2626;
            border-radius: 16px;
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 32px rgba(220, 38, 38, 0.25);
        }
        .badge {
            display: inline-block;
            background: rgba(220, 38, 38, 0.16);
            color: #f87171;
            border: 1px solid rgba(220, 38, 38, 0.5);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.6px;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 30px;
            color: #ef4444;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 16px;
            color: #d6c8c8;
            margin: 0 0 24px 0;
            line-height: 1.55;
        }
        .player-card {
            background: #180c0f;
            border: 1px solid rgba(220, 38, 38, 0.35);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 28px;
            font-size: 15px;
            color: #e8dada;
        }
        .player-name {
            color: #f87171;
            font-weight: 700;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-primary {
            background: #dc2626;
            color: #ffffff;
            border: none;
            box-shadow: 0 6px 18px rgba(220, 38, 38, 0.35);
        }
        .btn-primary:hover {
            background: #ef4444;
        }
        .btn-secondary {
            background: transparent;
            color: #f87171;
            border: 1px solid #dc2626;
        }
        .btn-secondary:hover {
            background: rgba(220, 38, 38, 0.16);
        }
        .room2-notice {
            margin-top: 18px;
            font-size: 13.5px;
            color: #f87171;
            display: none;
        }
    </style>
</head>
<body>
<main class="room-container">
    <div class="actions">
        <button type="button" id="start-room2-btn" class="btn btn-primary">Συνέχεια (Έναρξη Δωματίου 2)</button>
        <button type="button" id="exit-game-btn" class="btn btn-secondary">Έξοδος από το παιχνίδι</button>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const nickname = localStorage.getItem('playerNickname') || localStorage.getItem('username');
        const nameEl = document.getElementById('player-display-name');
        if (nickname && nameEl) {
            nameEl.textContent = nickname;
        }

        const startBtn = document.getElementById('start-room2-btn');
        if (startBtn) {
            startBtn.addEventListener('click', () => {
                window.location.href = 'sully.html';
            });
        }

        const exitBtn = document.getElementById('exit-game-btn');
        if (exitBtn) {
            exitBtn.addEventListener('click', () => {
                window.location.href = 'lobby.html';
            });
        }
    });
</script>
</body>
</html>
