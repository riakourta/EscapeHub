<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscapeHub - Lobby Μουσείου</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #080a0f;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 36px 36px;
            color: #d1d5db;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(
                circle at center,
                transparent 35%,
                rgba(160, 15, 15, 0.45) 75%,
                rgba(220, 20, 20, 0.85) 100%
            );
            pointer-events: none;
            z-index: 0;
            animation: warningSiren 2.2s ease-in-out infinite;
        }

        @keyframes warningSiren {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }

        .lobby-box {
            background-color: #0f1218;
            border: 1px solid #7f1d1d;
            border-radius: 6px;
            padding: 30px 38px;
            text-align: center;
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 1;
            animation: boxWarningGlow 2.2s ease-in-out infinite;
        }

        @keyframes boxWarningGlow {
            0%, 100% {
                border-color: #5c1818;
                box-shadow: 0 0 20px rgba(180, 20, 20, 0.15), 0 20px 50px rgba(0, 0, 0, 0.85);
            }
            50% {
                border-color: #dc2626;
                box-shadow: 0 0 55px rgba(239, 68, 68, 0.5), 0 20px 50px rgba(0, 0, 0, 0.85);
            }
        }

        h2 {
            color: #ef4444;
            font-size: 1.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0 0 8px 0;
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
        }

        .subtitle {
            color: #9ca3af;
            font-size: 0.88rem;
            line-height: 1.4;
            margin: 0 0 18px 0;
        }

        /* Χρώματα παικτών */
        .theme-blue { background-color: rgba(14, 165, 233, 0.22); border-color: #38bdf8; color: #38bdf8; }
        .theme-pink { background-color: rgba(236, 72, 153, 0.22); border-color: #f472b6; color: #f472b6; }
        .theme-purple { background-color: rgba(168, 85, 247, 0.22); border-color: #c084fc; color: #c084fc; }
        .theme-green { background-color: rgba(16, 185, 129, 0.22); border-color: #34d399; color: #34d399; }
        .theme-yellow { background-color: rgba(234, 179, 8, 0.22); border-color: #facc15; color: #facc15; }
        .theme-red { background-color: rgba(239, 68, 68, 0.22); border-color: #f87171; color: #f87171; }

        .counter {
            display: inline-block;
            background-color: #211c17;
            border: 1px solid #85683a;
            color: #e5e7eb;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .counter span {
            color: #eab308;
            font-weight: 700;
        }

        ul#playerList {
            list-style: none;
            padding: 0;
            margin: 0 0 22px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 180px;
            max-height: 260px;
            overflow-y: auto;
        }

        ul#playerList:empty {
            justify-content: center;
            align-items: center;
            border: 1px dashed #374151;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.01);
        }

        ul#playerList:empty::before {
            content: 'Waiting...';
            color: #6b7280;
            font-size: 0.88rem;
        }

        ul#playerList li {
            background-color: #211c17;
            border: 1px solid #85683a;
            border-radius: 3px;
            padding: 9px 14px;
            color: #f3f4f6;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .player-badge {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            border: 2px solid;
        }

        .player-badge svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        .actions-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        button#startBtn {
            background-color: #990000;
            color: #ffffff;
            border: 1px solid #b91c1c;
            outline: none;
            padding: 11px 32px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }

        button#startBtn:hover:not(:disabled) {
            background-color: #b30000;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4);
        }

        button#exitBtn {
            background-color: transparent;
            color: #9ca3af;
            border: 1px solid #374151;
            outline: none;
            padding: 6px 22px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button#exitBtn:hover {
            color: #f3f4f6;
            border-color: #6b7280;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .status-msg {
            margin-top: 14px;
            font-size: 0.88rem;
            min-height: 20px;
        }

        .status-error { color: #f87171; }
        .status-success { color: #38bdf8; }
    </style>
</head>
<body>

<div id="lobbyContainer"
     class="lobby-box"
     data-ws-endpoint="/ws/lobby"
     data-next-page="museum.html"
     data-exit-page="profile.html"
     data-max-players="6"
     data-error-template="Απαιτούνται τουλάχιστον {required} ληστές για την έναρξη! (Συνδεδεμένοι: {count}/{max})"
     data-starting-text="READY">

    <h2>LOBBY</h2>

    <div class="counter">
        Συνδεδεμένοι Ληστές: <span id="currentCount">0</span> / <span id="maxCount">6</span>
    </div>

    <ul id="playerList"></ul>

    <div class="actions-stack">
        <button id="startBtn" type="button">START THE ROBBERY</button>
        <button id="exitBtn" type="button">EXIT</button>
    </div>
    <div id="statusMsg" class="status-msg"></div>
</div>

<script src="apiClient.js"></script>
<script src="js/lobbySocket.js"></script>
</body>
</html>
