spring.application.name=escapehub
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/escapehub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:escapehub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:escapehub}
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=health,info
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Lobby & WebSockets: exactly one four-player room
escapehub.lobby.min-players=4
escapehub.websocket.lobby-endpoint=/ws/lobby
