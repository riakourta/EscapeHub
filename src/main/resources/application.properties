spring.application.name=escapehub

#Lobby & WebSockets
escapehub.lobby.min-players=3
escapehub.lobby.max-players=6
escapehub.websocket.lobby-endpoint=/ws/lobby
escapehub.websocket.allowed-origins=*

#Game State
escapehub.robery.duration=3600

PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/escapehub_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:escapehub_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:escapehub_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Info (???????? ?????????)
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=EscapeHub
info.app.version=0.1.0-SNAPSHOT
game.state.manager.remaining-time=3600